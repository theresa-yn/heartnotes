name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Check inline JavaScript syntax
      run: |
        perl -0ne 'while(/<script[^>]*>(.*?)<\/script>/sg){print $1, "\n"}' docs/index.html > /tmp/heartnotes-index-scripts.js
        node --check /tmp/heartnotes-index-scripts.js
        
    - name: Install Firebase CLI
      run: npm install -g firebase-tools
      
    - name: Deploy to Firebase
      run: |
        firebase use spiritual-journey-e3330 --token ${{ secrets.FIREBASE_TOKEN }}
        firebase deploy --only hosting:heartnotes --token ${{ secrets.FIREBASE_TOKEN }}
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
